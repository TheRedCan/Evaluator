name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check evaluator tests

      - name: Tests
        run: pytest --cov=evaluator --cov-report=term-missing

      - name: End-to-end smoke run
        # Real CLI invocation against the bundled sample dataset — proves
        # the harness wires together end-to-end, not just unit-level.
        run: python -m evaluator.run --dataset data/sample.jsonl --provider mock --out /tmp/ci-reports/
