[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluator"
version = "0.1.0"
description = "A minimal LLM evaluation harness — accuracy, hallucination, latency, embeddings, LLM-as-judge, A/B compare."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Omar Bassel" }]
keywords = ["llm", "evaluation", "rag", "benchmarking", "anthropic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # Core harness is pure stdlib.

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
embedding = ["sentence-transformers>=2.7.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5.0"]
all = ["anthropic>=0.40.0", "sentence-transformers>=2.7.0", "pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5.0"]

[project.scripts]
evaluator = "evaluator.run:main"

[project.urls]
Repository = "https://github.com/TheRedCan/Evaluator"

[tool.setuptools.packages.find]
include = ["evaluator*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length handled separately; some metric prompts are long.
